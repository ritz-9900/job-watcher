# Companies to watch. Adding a company on an already-supported platform only needs
# a new [[company]] block here. No code changes.
#
# Easiest way to get the values: open any job at that company on your phone or a
# personal computer, copy the job's URL, then run (offline, safe anywhere):
#     python -m watcher detect "<job url>" --name "Company"
#
# Supported platforms: workday, oracle, eightfold, greenhouse, lever, phenom, html_links
#
# Not watchable: Bain & Company. Its job search API (bain.com/en/api/jobsearch/...) is
# behind Cloudflare bot protection and returns 403 to any non-browser client, and the
# listings are not in its sitemap. Getting past that would mean evading bot protection,
# so it is left out (checked 2026-11-11).
#
# Not watchable: Walmart Global Tech. careers.walmart.com's robots.txt disallows /api and
# /results (its search), the guessed Workday tenant does not exist, and the sitemap lists
# ~16,000 job URLs (almost all US stores) with no location, so finding India roles would
# mean opening hundreds of job pages a day (checked 2026-11-11).
#
# STATUS: every entry below was verified live (date in its notes). Sites change without
# notice: if one breaks, run the "Probe career sites" GitHub workflow and check its log.

[[company]]
name = "JPMorgan Chase"
website = "jpmorganchase.com"
platform = "oracle"
enabled = true
notes = "Verified live 2026-11-10: anonymous API works, ~7,000 jobs, newest first."
[company.params]
host = "jpmc.fa.oraclecloud.com"
site_number = "CX_1001"
# keyword = "machine learning"   # optional: narrow the search on JPMC's side
# location_id = ""               # optional: Oracle location id (see README)

[[company]]
name = "American Express"
website = "americanexpress.com"
platform = "oracle"
enabled = true
notes = """Verified live 2026-11-10. Amex moved from Eightfold to Oracle Recruiting Cloud;
the public site is careers.americanexpress.com/en/sites/CX_1, the API is on the oraclecloud host."""
[company.params]
host = "egug.fa.us2.oraclecloud.com"
public_host = "careers.americanexpress.com"
site_number = "CX_1"

[[company]]
name = "Google"
website = "google.com"
platform = "html_links"
enabled = true
notes = """Parses Google's job-results HTML (most fragile entry). google.com/robots.txt
disallows the page= parameter for crawlers, so only the first results page (20 newest) is
read, once per search keyword."""
[company.params]
url = "https://www.google.com/about/careers/applications/jobs/results?q={query}&location=India&sort_by=date"
link_pattern = 'href="jobs/results/(?P<id>\d{6,})-(?P<slug>[a-z0-9-]+)[^"]*"\s+aria-label="Learn more about (?P<title>[^"]+)"'
job_url_template = "https://www.google.com/about/careers/applications/jobs/results/{id}-{slug}"
max_pages = 1

[[company]]
name = "S&P Global"
website = "spglobal.com"
platform = "workday"
enabled = true
notes = """Verified live 2026-11-11. careers.spglobal.com links to Workday (SPGI_Careers);
its robots.txt allows /SPGI_Careers/. Only ~50 India jobs, so instead of keyword searches
this reads every India listing (Workday's own country filter) and lets [filters] match."""
[company.params]
host = "spgi.wd5.myworkdayjobs.com"
tenant = "spgi"
site = "SPGI_Careers"
keywords = []                 # read all India jobs rather than searching
max_pages = 5                 # 20 per page; India had 54 jobs on 2026-11-11
applied_facets = { Location_Country = ["c4f78be1a8f14da0ab49ce1162348a5e"] }  # India

[[company]]
name = "HSBC"
website = "hsbc.com"
platform = "eightfold"
enabled = true
notes = """Verified live 2026-11-11. hsbc.com/careers links to portal.careers.hsbc.com, an
Eightfold site on HSBC's own domain; its robots.txt allows /api/apply and /careers.
(mycareer.hsbc.com is an older Avature portal and is not used.) Searches each keyword
within India; descriptions come from the per-job endpoint."""
[company.params]
host = "portal.careers.hsbc.com"
domain = "hsbc.com"
location = "India"

[[company]]
name = "BCG"
website = "bcg.com"
platform = "phenom"
enabled = true
notes = """Verified live 2026-11-11. careers.bcg.com is a Phenom People site; robots.txt allows
search-results and job pages. Its keyword search is semantic (hundreds of loose matches), so
this reads every India listing newest first (~110 jobs, 10 per page) until the age limit."""
[company.params]
host = "careers.bcg.com"
locale_path = "global/en"
query = { qcountry = "India" }
max_pages = 12                # 10 per page; India had 111 jobs on 2026-11-11

[[company]]
name = "Mastercard"
website = "mastercard.com"
platform = "workday"
enabled = true
notes = """Verified live 2026-11-11. careers.mastercard.com (Phenom) links to Workday
CorporateCareers. Searches each keyword, limited to Mastercard's offices in the five cities
via Workday's location facet (ids from `python -m watcher probe --only Mastercard`)."""
[company.params]
host = "mastercard.wd1.myworkdayjobs.com"
tenant = "mastercard"
site = "CorporateCareers"
applied_facets = { locations = [
  "8eab563831bf10acbc722e4859721571", "8ffae25149e210718ae5b2e1cb1993bb",  # Pune
  "8eab563831bf10acb97b7fba5feff76e", "2e83df2db0851073b1d3be60012912d5",  # Gurgaon
  "8eab563831bf10acb5d384310bb7d5ec",                                      # Bangalore
  "8eab563831bf10acb9d6f1103d78fa67",                                      # Hyderabad
  "8eab563831bf10acbb7b5bf86d570af1", "4a21bf4e5285455eb8a0037a87adf523",  # Mumbai
  "28905a74db1b10019f5bb16c36030000",                                      # Navi Mumbai (Finicity)
] }

[[company]]
name = "Citi"
website = "citigroup.com"
platform = "workday"
enabled = true
notes = """Verified live 2026-11-11. jobs.citi.com (Radancy/TalentBrew) links to Workday site "2".
Searches each keyword within India (Workday country facet; ~940 India jobs)."""
[company.params]
host = "citi.wd5.myworkdayjobs.com"
tenant = "citi"
site = "2"
applied_facets = { Country_and_Jurisdiction = ["c4f78be1a8f14da0ab49ce1162348a5e"] }  # India

[[company]]
name = "Microsoft"
website = "microsoft.com"
platform = "eightfold"
enabled = true
notes = """Verified live 2026-11-11. careers.microsoft.com uses Eightfold at
apply.careers.microsoft.com with the newer PCSX search (the v2 API answers 403 "Not
authorized for PCSX"); robots.txt allows /api/pcsx. Searches each keyword within India.
Microsoft rate-limits this API (HTTP 429 after a handful of quick requests, no Retry-After),
so it gets fewer keywords (its search is fuzzy, so they overlap anyway) and a 6 s gap."""
[company.params]
host = "apply.careers.microsoft.com"
domain = "microsoft.com"
api = "pcsx"
location = "India"
keywords = ["data scientist", "machine learning", "AI engineer", "generative AI"]
request_delay_seconds = 6

[[company]]
name = "EXL"
website = "exlservice.com"
platform = "oracle"
enabled = true
notes = "Verified live 2026-11-10: ~2,400 jobs, newest first. No robots.txt on the host."
[company.params]
host = "fa-ewjt-saasfaprod1.fa.ocs.oraclecloud.com"
site_number = "CX_2"

[[company]]
name = "Optum"
website = "optum.com"
platform = "html_links"
enabled = true
notes = """Verified live 2026-11-10. careers.unitedhealthgroup.com is a Radancy/TalentBrew site.
robots.txt disallows /search-jobs/ (keyword search), so this reads the per-city *location*
pages (allowed), 15 newest jobs each. There is no Mumbai page. Paging (p=) is ignored."""
[company.params]
urls = [
  "https://careers.unitedhealthgroup.com/location/bengaluru-karnataka-india-jobs/34088/1269750-1267701-1277333/4",
  "https://careers.unitedhealthgroup.com/location/hyderabad-telangana-india-jobs/34088/1269750-1254788-1269843/4",
  "https://careers.unitedhealthgroup.com/location/gurgaon-haryana-india-jobs/34088/1269750-1270260-1270642/4",
  "https://careers.unitedhealthgroup.com/location/pune-maharashtra-india-jobs/34088/1269750-1264418-1259229/4",
]
link_pattern = '(?s)href="(?P<path>/job/[^"/]+/[^"/]+/34088/(?P<id>\d+))"[^>]*>\s*<div>\s*<h2>(?P<title>[^<]+)</h2>.*?class="job-location[^"]*">(?P<location>[^<]+)<'
job_url_template = "https://careers.unitedhealthgroup.com{path}"
max_pages = 1

[[company]]
name = "Nomura"
website = "nomura.com"
platform = "html_links"
enabled = true
notes = """Verified live 2026-11-10. careers.nomura.com is SAP SuccessFactors. robots.txt
disallows /services/ (the RSS feed); /search/ is allowed. Its keyword search did not
filter results, so this reads ALL listings (100 per page, paged with startrow) and the
title/location filters do the matching."""
[company.params]
url = "https://careers.nomura.com/search/?q=&sortColumn=referencedate&sortDirection=desc&startrow={offset}"
page_size = 100
max_pages = 8
link_pattern = '(?s)<tr class="data-row">.*?<a href="(?P<path>/Nomura/job/[^"]+/(?P<id>\d+)/)" class="jobTitle-link">(?P<title>[^<]+)</a>.*?<td class="colLocation[^"]*"[^>]*>\s*<span class="jobLocation">(?P<location>[^<]+)</span>'
job_url_template = "https://careers.nomura.com{path}"
