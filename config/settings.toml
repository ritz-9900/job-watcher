# Global settings and default filters. Every company uses these filters unless its
# entry in companies.toml has its own [company.filters] table (which overrides
# individual keys).

[settings]
request_delay_seconds = 1.5           # pause between requests to the same site
timeout_seconds = 20
max_detail_fetches_per_company = 20   # job-description fetches per run (for experience filter)
health_alert_after_runs = 3           # alert if a site fails / returns 0 jobs this many runs in a row
prune_after_days = 45                 # forget jobs not seen for this long
utc_offset_minutes = 330              # IST, used for dates in alerts
telegram_max_individual_messages = 15 # beyond this, remaining jobs are grouped into one message
dashboard_days = 30                   # dashboard shows matching jobs first seen within this many days
alert_max_age_days = 3                # only alert for jobs posted within this many days (older finds: dashboard only)

[search]
# Sent to each site's own search box (where the platform supports it and robots.txt
# allows it), so each run reads relevant jobs instead of only the newest listings.
# Results are still checked against [filters] below. A company can override this with
# keywords = [...] in its [company.params], or keywords = [] to turn searching off.
keywords = ["data scientist", "data science", "machine learning", "ML engineer",
            "AI engineer", "generative AI", "GenAI", "LLM"]

[filters]
# Target: Data Science / AI / ML / GenAI roles, 2-3 years of experience, 5 cities.
# Matching rules:
#  - Keywords match whole words, case-insensitive ("AI" will not match "maintain").
#  - title_include: the title must contain at least one keyword. Empty list = any title.
#  - locations: the location must contain at least one entry. Empty list = anywhere.
#    Jobs with no location, or just "3 Locations", are kept.
#  - min/max_experience: compared with the "X years" requirement parsed from the job
#    description. Jobs that state no experience are kept. Delete both lines to turn this off.
#  - max_age_days: skip jobs posted longer ago than this (when the site shows a date).

title_include = [
  # Data science
  "Data Scientist", "Data Science",
  # AI / GenAI engineering
  "AI Engineer", "AI Software Engineer", "AI Developer", "Applied AI",
  "GenAI", "Gen AI", "Generative AI", "LLM", "Agentic", "Agentic AI", "NLP",
  # ML engineering
  "ML Engineer", "Machine Learning", "AI/ML", "AI / ML", "AI-ML", "ML/AI", "MLOps",
  "Applied Scientist",
]
# Titles above a 2-3 year level, and non-full-time roles.
title_exclude = [
  "Senior", "Sr", "Lead", "Manager", "Principal", "Staff", "Distinguished", "Architect",
  "Director", "Head", "Vice President", "VP", "Executive Director", "Expert",
  "intern", "internship", "apprentice", "trainee",
]
# Phrases that are NOT excluded even though they contain an excluded word: grades that
# are usually early/mid-level (e.g. EXL "Assistant Manager", Amex "Senior Analyst").
# The experience check still drops any of these that ask for 4+ years.
title_exclude_except = ["Assistant Manager", "Senior Analyst", "Sr Analyst", "Sr. Analyst",
                        "Senior Associate", "Sr Associate", "Sr. Associate"]
locations = ["Mumbai", "Pune", "Hyderabad", "Bengaluru", "Bangalore", "Gurugram", "Gurgaon"]
locations_exclude = []
# Jobs asking for more than 4 years minimum ("5+ years", "6-8 years") are dropped;
# jobs asking for up to 4 years ("2-4", "4+") are kept, as are jobs that state no
# experience. Jobs aimed below 2 years ("0-1 years") are dropped.
# Changing these re-evaluates jobs already seen (the parsed years are stored).
min_experience = 2
max_experience = 4
max_age_days = 30
